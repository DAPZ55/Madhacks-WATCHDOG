<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>811 Vision AR: supervisor</title>
<style>
  body { font: 16px/1.5 system-ui; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #111; }
  fieldset { border: 1px solid #bbb; border-radius: 8px; margin: 0 0 1rem; padding: 1rem; }
  label { display: block; margin: .5rem 0; }
  button { font: inherit; padding: .5rem 1rem; }
  img { max-width: 100%; border: 1px solid #bbb; margin-top: 1rem; }
  #result { white-space: pre-wrap; font: 14px ui-monospace, monospace; background: #f3f3f3; padding: .75rem; border-radius: 6px; }
  .warn { background: #fff3cd; border: 1px solid #e0b100; padding: .5rem .75rem; border-radius: 6px; }
</style>
<h1>811 Vision AR: supervisor</h1>
<p class="warn">Advisory demo. Not a utility locate. Never permission to dig.</p>
<fieldset>
  <legend>Upload overhead picture</legend>
  <label>Picture (must show all 4 anchor tags) <input type="file" id="file" accept="image/jpeg,image/png"></label>
  <label>Scale
    <select id="scale">
      <option value="0.1">1:10 scale model (street scenes)</option>
      <option value="1">1:1 real size</option>
    </select>
  </label>
  <button id="go">Scan and publish to phones</button>
</fieldset>
<div id="result" role="status" aria-live="polite">No scan yet.</div>
<img id="preview" alt="Scan result: detected marking centerlines drawn on the top-down view" hidden>
<fieldset>
  <legend>Live camera with pipe overlay</legend>
  <label>Depth scale
    <select id="liveScale">
      <option value="">Same as published map</option>
      <option value="1">1:1 real size</option>
      <option value="0.1">1:10 scale model</option>
    </select>
  </label>
  <label>State rules
    <select id="liveState">
      <option value="WI">Wisconsin</option>
      <option value="NY">New York</option>
      <option value="CHI">Chicago</option>
      <option value="TX">Texas</option>
    </select>
  </label>
  <button id="liveGo">Show live view</button>
  <img id="live" alt="Live overhead camera with detected anchors and simulated-depth pipes" hidden>
</fieldset>
<script>
document.getElementById('go').onclick = async () => {
  const file = document.getElementById('file').files[0];
  const out = document.getElementById('result');
  if (!file) { out.textContent = 'Choose a picture first.'; return; }
  out.textContent = 'Scanning...';
  const r = await fetch('/api/v1/scan?model_scale=' + document.getElementById('scale').value,
                        { method: 'POST', body: file });
  const data = await r.json();
  out.textContent = r.ok
    ? 'Published revision ' + data.published_revision + '\n' +
      data.utilities.map(u => u.id + '  ' + u.color + '  ' + u.class).join('\n')
    : 'Rejected: ' + data.detail;
  if (r.ok) {
    const img = document.getElementById('preview');
    img.src = '/api/v1/scan/preview?t=' + Date.now();
    img.hidden = false;
  }
};
const showLive = () => {
  const scale = document.getElementById('liveScale').value;
  const img = document.getElementById('live');
  img.src = '/camera?state=' + document.getElementById('liveState').value + (scale ? '&scale=' + scale : '');
  img.hidden = false;
};
document.getElementById('liveGo').onclick = showLive;
document.getElementById('liveScale').onchange = () => { if (!document.getElementById('live').hidden) showLive(); };
document.getElementById('liveState').onchange = () => { if (!document.getElementById('live').hidden) showLive(); };
</script>
</html>
